# Integração contínua: roda a cada push e a cada Pull Request.
# Instala as dependências e executa as verificações do Django e os testes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      # Chave usada apenas nos testes automáticos. Não é usada em nenhum
      # ambiente real e não dá acesso a nada.
      SECRET_KEY: chave-apenas-para-ci-nao-usar-em-producao
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar as dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar a configuração do Django
        run: python manage.py check

      - name: Verificar se há migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar os testes
        run: python manage.py test core --verbosity 2
