{% if form.errors %}<div class="alert alert-danger" role="alert">Confira os campos. O registro não foi salvo.</div>{% endif %}
{{ form.non_field_errors }}
{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} (obrigatório){% endif %}</label>{{ field }}<div id="erro_{{ field.name }}" class="text-danger">{{ field.errors }}</div></div>{% endfor %}
